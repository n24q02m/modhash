[workspace]
resolver = "3"
members = [
    "modhash-primitives",
    "modhash-inflate",
    "modhash-unicode",
    "modhash-math",
    "modhash-raster",
    "modhash-png",
    "modhash-bmp",
    "modhash-jpeg",
    "modhash-text",
    "modhash-fastcdc",
    "modhash-wav",
    "modhash-flac",
    "modhash-mp3",
    "modhash-audio",
    "modhash-mp4",
    "modhash-h264",
    "modhash-video",
    "modhash-zip",
    "modhash-pdf",
    "modhash-tier3",
    "modhash-index",
    "modhash",
    "modhash-cli",
]

[workspace.dependencies]
modhash = { path = "modhash", version = "0.1.0" }
modhash-audio = { path = "modhash-audio", version = "0.1.0" }
modhash-bmp = { path = "modhash-bmp", version = "0.1.0" }
modhash-fastcdc = { path = "modhash-fastcdc", version = "0.1.0" }
modhash-flac = { path = "modhash-flac", version = "0.1.0" }
modhash-h264 = { path = "modhash-h264", version = "0.1.0" }
modhash-index = { path = "modhash-index", version = "0.1.0" }
modhash-inflate = { path = "modhash-inflate", version = "0.1.0" }
modhash-jpeg = { path = "modhash-jpeg", version = "0.1.0" }
modhash-math = { path = "modhash-math", version = "0.1.0" }
modhash-mp3 = { path = "modhash-mp3", version = "0.1.0" }
modhash-mp4 = { path = "modhash-mp4", version = "0.1.0" }
modhash-pdf = { path = "modhash-pdf", version = "0.1.0" }
modhash-png = { path = "modhash-png", version = "0.1.0" }
modhash-primitives = { path = "modhash-primitives", version = "0.1.0" }
modhash-raster = { path = "modhash-raster", version = "0.1.0" }
modhash-text = { path = "modhash-text", version = "0.1.0" }
modhash-tier3 = { path = "modhash-tier3", version = "0.1.0" }
modhash-unicode = { path = "modhash-unicode", version = "0.1.0" }
modhash-video = { path = "modhash-video", version = "0.1.0" }
modhash-wav = { path = "modhash-wav", version = "0.1.0" }
modhash-zip = { path = "modhash-zip", version = "0.1.0" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/n24q02m/modhash"
homepage = "https://github.com/n24q02m/modhash"

[profile.release]
lto = true
codegen-units = 1

# Test binaries are exercising codec inner loops (Huffman walk, polyphase
# MACs) under `-O0`, which is unrealistically slow for fuzz-shaped tests:
# a single MP3 frame decode costs ~22 ms unoptimized and hostile-input
# scans multiply that by hundreds. Optimizing test builds keeps the
# conformance suite's runtime in seconds without touching debug gating
# (debug-assertions stay on, so arithmetic-overflow checks still fire).
[profile.test]
opt-level = 2
