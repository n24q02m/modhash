[workspace]
resolver = "3"
members = [
    "modhash-primitives",
    "modhash-inflate",
    "modhash-unicode",
    "modhash-math",
    "modhash-raster",
    "modhash-png",
    "modhash-bmp",
    "modhash-jpeg",
    "modhash-text",
    "modhash-fastcdc",
    "modhash-wav",
    "modhash-flac",
    "modhash-mp3",
    "modhash-audio",
    "modhash-mp4",
    "modhash-h264",
    "modhash-video",
    "modhash-zip",
    "modhash-pdf",
    "modhash-tier3",
    "modhash-index",
    "modhash",
    "modhash-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/n24q02m/modhash"
homepage = "https://github.com/n24q02m/modhash"

[profile.release]
lto = true
codegen-units = 1

# Test binaries are exercising codec inner loops (Huffman walk, polyphase
# MACs) under `-O0`, which is unrealistically slow for fuzz-shaped tests:
# a single MP3 frame decode costs ~22 ms unoptimized and hostile-input
# scans multiply that by hundreds. Optimizing test builds keeps the
# conformance suite's runtime in seconds without touching debug gating
# (debug-assertions stay on, so arithmetic-overflow checks still fire).
[profile.test]
opt-level = 2
