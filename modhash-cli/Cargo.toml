[package]
name = "modhash-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `modhash` command line interface."
readme = "README.md"
categories = ["algorithms", "cryptography"]

[dependencies]
modhash.workspace = true
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[[bin]]
name = "modhash"
path = "src/main.rs"
# rustdoc collision: this bin's `modhash` docs would overwrite the kit
# crate's `target/doc/modhash/index.html`. CLI usage docs live in
# docs/ (rendered site) instead.
doc = false
